<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Hide package fonts that flood the Word and spreadsheet font menu.

    These are folder rules, on purpose. A new file name inside one of these
    folders stays hidden, and the copy installed by this project draws.
    A font the distro adds in any other folder is left alone and can appear
    in the menu. Family-wide rejects are not used: a reject by name would
    also turn off the same face inside an application or in additions/.

    Paths below are the known Arch and Debian/Pop locations. They do not
    match LibreOffice, Wine, Calibre, Steam, SDDM, projectM, or imlib2.
    Fonts from this project live in ~/.local/share/fonts/us-english.
  -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/noto/*</glob>
      <glob>/usr/share/fonts/noto-cjk/*</glob>
      <glob>/usr/share/fonts/truetype/noto/*</glob>
      <glob>/usr/share/fonts/truetype/noto-cjk/*</glob>
      <glob>/usr/share/fonts/opentype/noto/*</glob>
      <glob>/usr/share/fonts/opentype/noto-cjk/*</glob>
      <glob>/usr/share/fonts/TTF/Meslo*</glob>
      <glob>/usr/share/fonts/TTF/Fantasque*</glob>
      <glob>/usr/share/fonts/truetype/Meslo*</glob>
      <glob>/usr/share/fonts/truetype/Fantasque*</glob>
      <glob>/usr/share/fonts/meslo/*</glob>
      <glob>/usr/share/fonts/truetype/meslo/*</glob>
      <glob>/usr/share/fonts/awesome-terminal-fonts/*</glob>
      <glob>/usr/share/fonts/OTF/PowerlineSymbols.otf</glob>
      <glob>/usr/share/fonts/opentype/PowerlineSymbols.otf</glob>
      <glob>/usr/share/fonts/truetype/font-awesome/*</glob>
      <glob>/usr/share/fonts/opentype/font-awesome/*</glob>
      <glob>/usr/share/fonts/TTF/fontawesome*</glob>
      <glob>/usr/share/fonts/TTF/FontAwesome*</glob>
      <glob>/usr/share/fonts/OTF/fontawesome*</glob>
      <glob>/usr/share/fonts/OTF/FontAwesome*</glob>

      <!-- Bitstream Vera packages. projectM keeps its own copy outside this tree. -->
      <glob>/usr/share/fonts/TTF/Vera*.ttf</glob>
      <glob>/usr/share/fonts/truetype/ttf-bitstream-vera/*</glob>
      <glob>/usr/share/fonts/truetype/bitstream-vera/*</glob>

      <glob>/usr/share/fonts/wenquanyi/*</glob>
      <glob>/usr/share/fonts/truetype/wqy/*</glob>
      <glob>/usr/share/fonts/truetype/wqy-zenhei/*</glob>

      <!-- Our copies of these faces are the ones in the menu. The globs name
           those packages only, so a future Fira Sans package is left alone. -->
      <glob>/usr/share/fonts/TTF/FiraCode-*</glob>
      <glob>/usr/share/fonts/truetype/firacode/*</glob>
      <glob>/usr/share/fonts/truetype/fira-code/*</glob>
      <glob>/usr/share/fonts/opentype/firacode/*</glob>
      <glob>/usr/share/fonts/opentype/fira-code/*</glob>
      <glob>/usr/share/fonts/TTF/OpenSans-*</glob>
      <glob>/usr/share/fonts/truetype/open-sans/*</glob>
      <glob>/usr/share/fonts/truetype/opensans/*</glob>
      <glob>/usr/share/fonts/TTF/DejaVuSansCondensed*</glob>
      <glob>/usr/share/fonts/TTF/DejaVuSerifCondensed*</glob>
      <glob>/usr/share/fonts/TTF/DejaVuSans-ExtraLight*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSerifCondensed*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSans-ExtraLight*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
