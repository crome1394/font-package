<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Document font names. binding="same" plus <accept> means the real font
    wins when it is installed, and the open font is used when it is not.
    Menu names for the open fonts are added in 62-us-english-names.conf.
  -->

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Inter</family>
      <family>Liberation Sans</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Source Serif 4</family>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Cascadia Mono</family>
      <family>Ubuntu Mono</family>
      <family>Liberation Mono</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same"><family>Garamond</family><accept><family>EB Garamond</family></accept></alias>
  <alias binding="same"><family>Apple Garamond</family><accept><family>EB Garamond</family></accept></alias>
  <alias binding="same"><family>ITC Garamond</family><accept><family>EB Garamond</family></accept></alias>
  <alias binding="same"><family>EB Garamond 12</family><accept><family>EB Garamond</family></accept></alias>

  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Cambria Math</family><accept><family>STIX Two Math</family></accept></alias>
  <alias binding="same"><family>Georgia</family><accept><family>Gelasio</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Aptos</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>Cascadia Mono</family></accept></alias>

  <alias binding="same"><family>Helvetica</family><accept><family>TeX Gyre Heros</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>TeX Gyre Heros</family></accept></alias>
  <alias binding="same"><family>Helvetica Narrow</family><accept><family>TeX Gyre Heros Cn</family></accept></alias>
  <alias binding="same"><family>Arial Narrow</family><accept><family>TeX Gyre Heros Cn</family></accept></alias>
  <alias binding="same"><family>Times</family><accept><family>TeX Gyre Termes</family></accept></alias>
  <alias binding="same"><family>Palatino</family><accept><family>TeX Gyre Pagella</family></accept></alias>
  <alias binding="same"><family>Palatino Linotype</family><accept><family>TeX Gyre Pagella</family></accept></alias>
  <alias binding="same"><family>Book Antiqua</family><accept><family>TeX Gyre Pagella</family></accept></alias>
  <alias binding="same"><family>Bookman Old Style</family><accept><family>TeX Gyre Bonum</family></accept></alias>
  <alias binding="same"><family>Century Schoolbook</family><accept><family>TeX Gyre Schola</family></accept></alias>
  <alias binding="same"><family>Century Gothic</family><accept><family>TeX Gyre Adventor</family></accept></alias>
  <alias binding="same"><family>Avant Garde</family><accept><family>TeX Gyre Adventor</family></accept></alias>
  <alias binding="same"><family>ITC Avant Garde Gothic</family><accept><family>TeX Gyre Adventor</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>TeX Gyre Cursor</family></accept></alias>
  <alias binding="same"><family>ITC Zapf Chancery</family><accept><family>TeX Gyre Chorus</family></accept></alias>

  <alias binding="same"><family>Baskerville</family><accept><family>Libre Baskerville</family></accept></alias>
  <alias binding="same"><family>Baskerville Old Face</family><accept><family>Bacasime Antique</family></accept></alias>
  <alias binding="same"><family>Big Caslon</family><accept><family>Libre Caslon Text</family></accept></alias>
  <alias binding="same"><family>Didot</family><accept><family>GFS Didot</family></accept></alias>
  <alias binding="same"><family>Franklin Gothic</family><accept><family>Libre Franklin</family></accept></alias>
  <alias binding="same"><family>Franklin Gothic Medium</family><accept><family>Libre Franklin</family></accept></alias>
  <alias binding="same"><family>Futura</family><accept><family>League Spartan</family></accept></alias>
  <alias binding="same"><family>Futura Medium</family><accept><family>League Spartan</family></accept></alias>
  <alias binding="same"><family>Optima</family><accept><family>Philosopher</family></accept></alias>
  <alias binding="same"><family>Lucida Grande</family><accept><family>Lunasima</family></accept></alias>
  <alias binding="same"><family>Lucida Handwriting</family><accept><family>Lumanosimo</family></accept></alias>
  <alias binding="same"><family>Lucida Calligraphy</family><accept><family>Lugrasimo</family></accept></alias>
  <alias binding="same"><family>Agency FB</family><accept><family>Agdasima</family></accept></alias>
  <alias binding="same"><family>Berlin Sans FB</family><accept><family>Belanosima</family></accept></alias>
  <alias binding="same"><family>Cooper Black</family><accept><family>Caprasimo</family></accept></alias>

  <alias binding="same"><family>Gill Sans</family><accept><family>Gillius ADF No2</family></accept></alias>
  <alias binding="same"><family>Gill Sans MT</family><accept><family>Gillius ADF No2</family></accept></alias>

  <alias binding="same"><family>Menlo</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>JetBrainsMono NFM</family><accept><family>JetBrainsMono Nerd Font Mono</family></accept></alias>
  <alias binding="same"><family>JetBrainsMono NFM Medium</family><accept><family>JetBrainsMono Nerd Font Mono</family></accept></alias>
  <alias binding="same"><family>Fira Code Light</family><accept><family>Fira Code</family></accept></alias>
  <alias binding="same"><family>Fira Code Retina</family><accept><family>Fira Code</family></accept></alias>
  <alias binding="same"><family>Fira Code Medium</family><accept><family>Fira Code</family></accept></alias>
  <alias binding="same"><family>Fira Code SemiBold</family><accept><family>Fira Code</family></accept></alias>
  <alias binding="same"><family>Open Sans Light</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Open Sans SemiBold</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Open Sans ExtraBold</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Open Sans Condensed</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>DejaVu Sans Light</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>DejaVu Sans Condensed</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>DejaVu Serif Condensed</family><accept><family>DejaVu Serif</family></accept></alias>
  <alias binding="same"><family>Ubuntu Light</family><accept><family>Ubuntu</family></accept></alias>
  <alias binding="same"><family>Selawik Semibold</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Monaco</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>SF Pro</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro Text</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro Display</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>San Francisco</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>New York</family><accept><family>Source Serif 4</family></accept></alias>
  <alias binding="same"><family>Avenir</family><accept><family>Nunito Sans</family></accept></alias>
  <alias binding="same"><family>Avenir Next</family><accept><family>Nunito Sans</family></accept></alias>
  <alias binding="same"><family>Hoefler Text</family><accept><family>Libre Baskerville</family></accept></alias>

  <alias binding="weak">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>und-zsye</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
